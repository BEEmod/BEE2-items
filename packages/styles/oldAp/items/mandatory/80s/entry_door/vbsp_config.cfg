"Conditions"
	{
	"Condition"
		{
		"Priority"	"10"
		"instance"	"[elevatorEntry]"

		"Switch"
			{
			// Is the sphere closed, opened, or removed
			"test" "instvar"
			"$sphere_type CLOSED"
				{
				"Condition"
					{
					"has"	"CubeDropper"
					"Result"
						{
						"addOverlay" "instances/BEE2/80s/sphere_sp/sphere/dropper.vmf"
						}
					}
				"addShuffleGroup"
					{
					"Var" "$color"
					"Seed" "pipes"
					"Selector"
						{
						"pools" "lower"
						"value" "0 128 255"
						"Conditions" { "has" "blueGel" }
						}
					"Selector"
						{
						"pools" "lower"
						"value" "255 128 0"
						"Conditions" { "has" "orangeGel" }
						}
					"Selector"
						{
						"pools" "lower"
						"value" "96 96 96"
						"Conditions" { "has" "greyGel" }
						}
					"Selector"
						{
						"pools" "lower upper"
						"value" "128 255 255"
						"Conditions" { "has" "waterGel" }
						}
					"Selector"
						{
						"pools" "lower upper"
						"value" "255 255 255"
						"Conditions" { "has" "whiteGel" }
						}
					"Pool"
						{
						"lower" "instances/BEE2/80s/sphere_sp/sphere/tube_lower_1.vmf"
						"lower" "instances/BEE2/80s/sphere_sp/sphere/tube_lower_2.vmf"
						"lower" "instances/BEE2/80s/sphere_sp/sphere/tube_lower_3.vmf"
						"lower" "instances/BEE2/80s/sphere_sp/sphere/tube_lower_4.vmf"
						"lower" "instances/BEE2/80s/sphere_sp/sphere/tube_lower_5.vmf"
						"upper" "instances/BEE2/80s/sphere_sp/sphere/tube_upper_1.vmf"
						"upper" "instances/BEE2/80s/sphere_sp/sphere/tube_upper_2.vmf"
						"upper" "instances/BEE2/80s/sphere_sp/sphere/tube_upper_3.vmf"
						}
					}
				}
			"$sphere_type OPEN"
				{
				"suffix"	"open"
				"Has" "RetroOpenSphere"
				"Condition"
					{
					"has"	"blueGel"
					"Result"
						{
						"addOverlay" "instances/BEE2/80s/sphere_sp/sphere_open/pipes_blue.vmf"
						}
					}
				"Condition"
					{
					"has"	"whiteGel"
					"Result"
						{
						"addOverlay" "instances/BEE2/80s/sphere_sp/sphere_open/pipes_white.vmf"
						}
					}
				"Condition"
					{
					"has"	"orangeGel"
					"Result"
						{
						"addOverlay" "instances/BEE2/80s/sphere_sp/sphere_open/pipes_orange.vmf"
						}
					}
				"Condition"
					{
					"has"	"waterGel"
					"Result"
						{
						"addOverlay" "instances/BEE2/80s/sphere_sp/sphere_open/pipes_water.vmf"
						}
					}
				"Condition"
					{
					"has"	"greyGel"
					"Result"
						{
						"addOverlay" "instances/BEE2/80s/sphere_sp/sphere_open/pipes_grey.vmf"
						}
					}
				"Condition"
					{
					"has"	"pellet"
					"Result"
						{
						"addOverlay" "instances/BEE2/80s/sphere_sp/sphere_open/pellet.vmf"
						}
					}
				"Condition"
					{
					"has"	"DiversityVent"
					"Result"
						{
						"addOverlay" "instances/BEE2/80s/sphere_sp/sphere_open/vent.vmf"
						}
					}
				"Condition"
					{
					"has"  "bridge"
					"Result"
						{
						"addOverlay" "instances/BEE2/80s/sphere_sp/sphere_open/bridge.vmf"
						}
					}
				"Condition"
					{
					"has"	"laser"
					"Result"
						{
						"addOverlay" "instances/BEE2/80s/sphere_sp/sphere_open/laser.vmf"
						}
					"Else"
						{
						"addOverlay" "instances/BEE2/80s/sphere_sp/sphere_open/no_laser.vmf"
						}
					}
				}
			"$sphere_type NONE"
				{
				"ChangeInstance" "instances/BEE2/50s/sphere_sp/elevator_entrance/common.vmf"
				"Has" "RetroNoSphere"
				"Switch"
					{
					"test" "instvar"
					"$stair_dir UP"
						{
						"addOverlay" "instances/BEE2/80s/sphere_sp/elevator_entrance/stair_up.vmf"
						}
					"$stair_dir DOWN"
						{
						"addOverlay" "instances/BEE2/80s/sphere_sp/elevator_entrance/stair_dn.vmf"
						}
					"$stair_dir FLAT"
						{
						"addOverlay" "instances/BEE2/80s/sphere_sp/elevator_entrance/stair_flat.vmf"
						}
					}
				"Condition"
					{
					"instvar" "$no_player_start = 1"
					"Result"
						{
						// Spawns in the elevator.
						"addOverlay" "instances/BEE2/50s/sphere_sp/elevator_entrance/logic.vmf"
						}
					}
				"addShuffleGroup"
					{
					"Var" "$color"
					"Seed" "pipes"
					"Selector"
						{
						"pools" "lower"
						"value" "0 128 255"
						"Conditions" { "has" "blueGel" }
						}
					"Selector"
						{
						"pools" "lower"
						"value" "128 255 255"
						"Conditions" { "has" "waterGel" }
						}
					"Selector"
						{
						"pools" "lower"
						"value" "255 128 0"
						"Conditions" { "has" "orangeGel" }
						}
					"Selector"
						{
						"pools" "lower"
						"value" "96 96 96"
						"Conditions" { "has" "greyGel" }
						}
					"Selector"
						{
						"pools" "lower"
						"value" "255 255 255"
						"Conditions" { "has" "whiteGel" }
						}
					"Pool"
						{
						"lower" "instances/BEE2/80s/sphere_sp/elevator_entrance/pipes_lower1.vmf"
						"lower" "instances/BEE2/80s/sphere_sp/elevator_entrance/pipes_lower2.vmf"
						"lower" "instances/BEE2/80s/sphere_sp/elevator_entrance/pipes_lower3.vmf"
						"lower" "instances/BEE2/80s/sphere_sp/elevator_entrance/pipes_lower4.vmf"
						"lower" "instances/BEE2/80s/sphere_sp/elevator_entrance/pipes_lower5.vmf"
						}
					}
				"Condition"
					{
					"has"	"Neurotoxin"
					"Result"
						{
						"addOverlay" "instances/BEE2/80s/sphere_sp/elevator_entrance/pipes_toxin.vmf"
						}
					}
				}
			}
		}
	
	"Condition"
		{
		"Priority" "50"
		"instance" "[door_frame]" // SP and Coop.
		"Result"
			{
			"TemplateBrush" "BEE2_DOOR_FRAME_80s"
			}
		"Condition"
			{
			"instvar" "$attach horizontal"
			"StyleVar" "DoorCameras"
			// Basic check that this space is free - check all four blocks, and that it's inside the map.
			"BlockType"
				{
				"Offset" "0 1 1"
				"Type"   "AIR OCCUPIED GOO"
				}
			"PosIsSolid"
				{
				"Pos" "-64 144 80"
				"dir" "1 0 0"
				"Type" "tile"
				}
			"PosIsSolid"
				{
				"Pos" "-64 176 80"
				"dir" "1 0 0"
				"Type" "tile"
				}
			"PosIsSolid"
				{
				"Pos" "-64 144 112"
				"dir" "1 0 0"
				"Type" "tile"
				}
			"PosIsSolid"
				{
				"Pos" "-64 176 112"
				"dir" "1 0 0"
				"Type" "tile"
				}
			"Result"
				{
				"AddOverlay" "instances/BEE2/50s/sphere_sp/door_speaker.vmf"
				}
			}
		}	
	
	"Condition"
		{
		"Priority" "10"
		"Instance" "[spEntryCorr]"
		"Condition"
			{
			"instvar" "$door testchamber"
			"Result"
				{
				"AddOverlay" "instances/BEE2/50s/sphere_sp/entry_door.vmf"
				"TemplateBrush" "BEE2_DOOR_FRAME_80s"
				}
			}
		"Condition"
			{
			"InstVar" "$door remove"
			"Switch"
				{
				"Flag" "InstVar" 
				"$attach down"
					{
					"TemplateBrush" "BEE2_DOOR_FRAME_VERTICAL:down"
					}
				"$attach up"
					{
					"TemplateBrush" "BEE2_DOOR_FRAME_VERTICAL:up"
					}
				}
			}
		"Result"
			{
			// Place the appropriate corridor template, with signs which alter
			// based on the chamber contents. If not defined, does nothing.
			"TemplateBrush"
				{
				"ID" "$template"
				"Visgroup"
					{
					"gel_bounce"   { "has" "BlueGel" }
					"gel_speed"    { "has" "OrangeGel" }
					"gel_portal"   { "has" "WhiteGel" }
					"gel_dropper"  { "has" "GelDropper" }
					"ball_button"  { "has" "BallButton" }
					"ball_dropper" { "has" "CubeDropperSphere" }
					"cube_button"  { "has" "CubeButton" }
					"cube_dropper" { "has" "CubeDropperNotSphereShaped" }
					"laser_cube"   { "has" "CubeReflect" }
					"danger"       { "has" "Deadly" }
					"turret"       { "has" "Turret" }
					"crusher"      { "has" "Crusher" }
					"goo"          { "has" "Goo" }
					"bridge"       { "has" "Bridge" }
					"pellet"       { "has" "Pellet" }
					"funnel"       { "has" "Funnel" }
					"respirator" 
						{
						"OR" 
							{
							"has" "Funnel"
							"has" "Neurotoxin"
							}
						}
					"turret_burn"
						{
						// Do we have a laser, and a turret we can burn?
						"has"	"CubeReflect"
						"has"	"Laser"
						"has"	"Turret"
						}
					}
				}
			}

		"Condition"
			{
			"instance" "instances/BEE2/80s/sphere_sp/entrance_lobby_corridor.vmf"
			"Result"
				{
				"addCavePortrait" "instances/BEE2/80s/sphere_sp/entrance_lobby_portrait.vmf"
				}
			}

		// Add in piping if water is present.
		"Condition"
			{
			"instance" "instances/BEE2/80s/sphere_sp/entrance_half_office_corridor.vmf"
			"Has" "Water"
			"Result"
				{
				"addOverlay" "instances/BEE2/80s/sphere_sp/entrance_half_office_water.vmf"
				}
			}
		}
	}
