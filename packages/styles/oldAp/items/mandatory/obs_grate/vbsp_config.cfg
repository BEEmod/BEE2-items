"Replacements"
	{
	"%SP_CLOSE_YAW%" "0"
	"%SP_OPEN_YAW%" "0"
	"%MP_OPEN_YAW%" "0"
	"%MP_CLOSE_YAW%" "0"
	}
"Conditions"
	{
	"Condition"
		{
		"Priority" "11"
		"instance" "<ITEM_OBSERVATION_ROOM>"
		"Condition"
			{
			"OR"
				{
				"Has" "RetroNoSphere" //If we aren't using a sphere, use an observation room instance
				"Has" "ObsWorldPortal" // Already added, convert to the observation room instance.
				}
			"Result"
				{
				"ChangeInstance" "%OBS_ROOM%"
				"SwitchOrientation" "wall"
				"addCavePortrait" "instances/BEE2/clean/items/observation_room_portrait.vmf"
				}
			"Else"
				{
				"Has"	"ObservationGrate"
				"Has"	"ObsWorldPortal"
				}
			}
		}

	"Condition"
		{
		"instance" "[spEntry]"
		"Priority" "12"
		"Has" "ObsWorldPortal"
		"Condition"
			{
			"Has"	"RetroOpenSphere"
			"Result"
				{
				"addOverlay"
					{
					"File"   "instances/BEE2/50s/items/observation_grate_sphere.vmf"
					"Offset" "%SP_OPEN_OFF%"
					"Angles" "0 %SP_OPEN_YAW% 0"
					}
				}
			"Else"
				{
				"addOverlay"
					{
					"File"   "instances/BEE2/50s/items/observation_grate_sphere.vmf"
					"Offset" "%SP_CLOSE_OFF%"
					"Angles" "0 %SP_CLOSE_YAW% 0"
					}
				}
			}
		}
	"Condition"
		{
		"instance" "[coopExit]"
		"Priority" "12"
		"Has" "ObsWorldPortal"
		"Condition"
			{
			"Has" "RetroOpenSphere"
			"Result"
				{
				"addOverlay"
					{
					"File"   "instances/BEE2/50s/items/observation_grate_sphere.vmf"
					"Offset" "%MP_OPEN_OFF%"
					"Angles" "0 %MP_OPEN_YAW% 0"
					}
				}
			"Else"
				{
				"addOverlay"
					{
					"File"   "instances/BEE2/50s/items/observation_grate_sphere.vmf"
					"Offset" "%MP_CLOSE_OFF%"
					"Angles" "0 %MP_CLOSE_YAW% 0"
					}
				}
			}
		}
	}
