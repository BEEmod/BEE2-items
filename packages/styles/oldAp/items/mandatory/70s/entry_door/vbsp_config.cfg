"Conditions"
	{
	"Condition"
		{
		"Priority"	"10"
		"instance"	"[elevatorEntry]"

		"Switch"
			{
			// Is the sphere closed, opened, or removed
			"test" "instvar"
			"$sphere_type CLOSED"
				{
				"addShuffleGroup"
					{
					"Var" "$color"
					"Seed" "pipes"
					"Selector"
						{
						"pools" "lower mid"
						"value" "0 128 255"
						"Conditions" { "has" "blueGel" }
						}
					"Selector"
						{
						"pools" "lower mid upper"
						"value" "128 255 255"
						"Conditions" { "has" "waterGel" }
						}
					"Selector"
						{
						"pools" "lower mid"
						"value" "255 128 0"
						"Conditions" { "has" "orangeGel" }
						}
					"Selector"
						{
						"pools" "lower mid"
						"value" "96 96 96"
						"Conditions" { "has" "greyGel" }
						}
					"Selector"
						{
						"pools" "mid upper"
						"value" "255 255 255"
						"Conditions" { "has" "whiteGel" }
						}
					"Pool"
						{
						"lower" "instances/BEE2/70s/sphere_sp/sphere/pipes_lower_1.vmf"
						"lower" "instances/BEE2/70s/sphere_sp/sphere/pipes_lower_2.vmf"
						"lower" "instances/BEE2/70s/sphere_sp/sphere/pipes_lower_3.vmf"
						"mid"   "instances/BEE2/70s/sphere_sp/sphere/pipes_mid_1.vmf"
						"mid"   "instances/BEE2/70s/sphere_sp/sphere/pipes_mid_2.vmf"
						"upper" "instances/BEE2/70s/sphere_sp/sphere/pipes_upper_1.vmf"
						"upper" "instances/BEE2/70s/sphere_sp/sphere/pipes_upper_2.vmf"
						"upper" "instances/BEE2/70s/sphere_sp/sphere/pipes_upper_3.vmf"
						"upper" "instances/BEE2/70s/sphere_sp/sphere/pipes_upper_4.vmf"
						}
					}
				"Condition"
					{
					"has"	"CubeDropper"
					"Result"
						{
						"addOverlay" "instances/BEE2/70s/sphere_sp/sphere/dropper.vmf"
						}
					}
				}
			"$sphere_type NONE"
				{
				"ChangeInstance" "instances/BEE2/50s/sphere_sp/elevator_entrance/common.vmf"
				"Has" "RetroNoSphere"
				"Switch"
					{
					"test" "instvar"
					"$stair_dir UP"
						{
						"addOverlay" "instances/BEE2/70s/sphere_sp/elevator_entrance/stair_up.vmf"
						}
					"$stair_dir DOWN"
						{
						"addOverlay" "instances/BEE2/70s/sphere_sp/elevator_entrance/stair_dn.vmf"
						}
					"$stair_dir FLAT"
						{
						"addOverlay" "instances/BEE2/70s/sphere_sp/elevator_entrance/stair_flat.vmf"
						}
					}
				"Condition"
					{
					"instvar" "$no_player_start = 1"
					"Result"
						{
						// Spawns in the elevator.
						"addOverlay" "instances/BEE2/50s/sphere_sp/elevator_entrance/logic.vmf"
						}
					"Else"
						{
						"addOverlay" "instances/BEE2/50s/sphere_sp/elevator_entrance/logic_nospawn.vmf"
						}
					}
				"addShuffleGroup"
					{
					"Var" "$color"
					"Seed" "pipes"
					"Selector"
						{
						"pools" "lower"
						"value" "0 128 255"
						"Conditions" { "has" "blueGel" }
						}
					"Selector"
						{
						"pools" "lower"
						"value" "128 255 255"
						"Conditions" { "has" "waterGel" }
						}
					"Selector"
						{
						"pools" "lower"
						"value" "255 128 0"
						"Conditions" { "has" "orangeGel" }
						}
					"Selector"
						{
						"pools" "lower"
						"value" "96 96 96"
						"Conditions" { "has" "greyGel" }
						}
					"Selector"
						{
						"pools" "upper"
						"value" "255 255 255"
						"Conditions" { "has" "whiteGel" }
						}
					"Pool"
						{
						"lower" "instances/BEE2/50s/sphere_sp/elevator_entrance/pipes_lower1.vmf"
						"lower" "instances/BEE2/50s/sphere_sp/elevator_entrance/pipes_lower2.vmf"
						"lower" "instances/BEE2/60s/sphere_sp/elevator_entrance/pipes_lower1.vmf"
						"lower" "instances/BEE2/70s/sphere_sp/elevator_entrance/pipes_lower1.vmf"
						"upper" "instances/BEE2/50s/sphere_sp/elevator_entrance/pipes_upper3.vmf"
						}
					}
				"Condition"
					{
					"has"	"Neurotoxin"
					"Result"
						{
						"addOverlay" "instances/BEE2/50s/sphere_sp/elevator_entrance/pipes_toxin.vmf"
						}
					}
				}
			}
		}
		
	"Condition"
		{
		"Priority"	"10"
		"instance"	"instances/BEE2/70s/sphere_sp/entrance_corridor_lobby.vmf"
		"Result"
			{
			"addCavePortrait" "instances/BEE2/70s/sphere_sp/entry_corridor_lobby/portrait.vmf"
			}
		"Condition"
			{
			"Has" "whiteGel"
			"Result"
				{
				"addOverlay" "instances/BEE2/70s/sphere_sp/entry_corridor_lobby/whitegel.vmf"
				}
			}
		}
	
	"Condition"
		{
		"Priority" "10"
		"Instance" "[spEntryCorr]"
		"Condition"
			{
			"instvar" "$door testchamber"
			"Result"
				{
				"AddOverlay" "instances/BEE2/50s/sphere_sp/entry_door.vmf"
				}
			}
		"Condition"
			{
			"InstVar" "$door remove"
			"Switch"
				{
				"Flag" "InstVar" 
				"$attach down"
					{
					"TemplateBrush" "BEE2_DOOR_FRAME_VERTICAL:down"
					}
				"$attach up"
					{
					"TemplateBrush" "BEE2_DOOR_FRAME_VERTICAL:up"
					}
				}
			}
		"Result"
			{
			// Place the appropriate corridor template, with signs which alter
			// based on the chamber contents. If not defined, does nothing.
			"TemplateBrush"
				{
				"ID" "$template"
				"Visgroup"
					{
					"gel_bounce"   { "has" "bluegel" }
					"gel_speed"    { "has" "orangegel" }
					"gel_portal"   { "has" "whitegel" }
					"funnel"       { "has" "funnel" }
					"danger"       { "has" "deadly" }
					"turret"       { "has" "turret" }
					"crusher"      { "has" "crusher" }
					"goo"          { "has" "goo" }
					"bridge"       { "has" "bridge" }
					"pellet"       { "has" "pellet" }
					"ball_dropper" { "has" "cubesphereshaped" }

					"laser_catcher" 
						{
						"OR" 
							{
							"has"	"LaserCatcher"
							"has"	"LaserRelay"
							}
						}
					}
				}
			}
		}

	"Condition"
		{
		"Priority" "50"
		"Instance" "[spEntryCorr]"
		"Condition"
			{
			"instvar" "$door testchamber"
			"Result"
				{
				"TemplateBrush" "BEE2_DOOR_FRAME_70s"
				}
			}
		"Condition"
			{
			"instvar" "$attach horizontal"
			"StyleVar" "DoorCameras"
			// Basic check that this space is free - check all four blocks, and that it's inside the map.
			"BlockType"
				{
				"Offset" "0 1 1"
				"Type"   "AIR OCCUPIED GOO"
				}
			"PosIsSolid"
				{
				"Pos" "-64 144 80"
				"dir" "1 0 0"
				"Type" "tile"
				}
			"PosIsSolid"
				{
				"Pos" "-64 176 80"
				"dir" "1 0 0"
				"Type" "tile"
				}
			"PosIsSolid"
				{
				"Pos" "-64 144 112"
				"dir" "1 0 0"
				"Type" "tile"
				}
			"PosIsSolid"
				{
				"Pos" "-64 176 112"
				"dir" "1 0 0"
				"Type" "tile"
				}
			"Result"
				{
				"AddOverlay" "instances/BEE2/50s/sphere_sp/door_speaker.vmf"
				}
			}
		}
	}
