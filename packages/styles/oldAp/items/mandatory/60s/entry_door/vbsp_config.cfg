"Conditions"
	{
	"Condition"
		{
		"Priority"	"10"
		"instance"	"[elevatorEntry]"

		"Switch"
			{
			// Is the sphere closed, opened, or removed
			"test" "instvar"
			"$sphere_type CLOSED"
				{
				"Condition"
					{
					"has"	"blueGel"
					"Result"
						{
						"addOverlay" "instances/BEE2/60s/sphere_sp/sphere/bluegel.vmf"
						}
					}
				"Condition"
					{
					"has"	"orangeGel"
					"Result"
						{
						"addOverlay" "instances/BEE2/60s/sphere_sp/sphere/orangegel.vmf"
						}
					}
				"Condition"
					{
					"has"	"whiteGel"
					"Result"
						{
						"addOverlay" "instances/BEE2/60s/sphere_sp/sphere/whitegel.vmf"
						}
					}
				"Condition"
					{
					"has"	"clearGel"
					"Result"
						{
						"addOverlay" "instances/BEE2/60s/sphere_sp/sphere/water.vmf"
						}
					}
				"Condition"
					{
					"has"	"greyGel"
					"Result"
						{
						"addOverlay" "instances/BEE2/60s/sphere_sp/sphere/greygel.vmf"
						}
					}
				"Condition"
					{
					"has"	"DiversityVent"
					"Result"
						{
						"addOverlay" "instances/BEE2/60s/sphere_sp/sphere/vent.vmf"
						}
					}
				}
			"$sphere_type NONE"
				{
				"ChangeInstance" "instances/BEE2/50s/sphere_sp/elevator_entrance/common.vmf"
				"Has" "RetroNoSphere"
				"Switch"
					{
					"test" "instvar"
					"$stair_dir UP"
						{
						"addOverlay" "instances/BEE2/60s/sphere_sp/elevator_entrance/stair_up.vmf"
						}
					"$stair_dir DOWN"
						{
						"addOverlay" "instances/BEE2/60s/sphere_sp/elevator_entrance/stair_dn.vmf"
						}
					"$stair_dir FLAT"
						{
						"addOverlay" "instances/BEE2/60s/sphere_sp/elevator_entrance/stair_flat.vmf"
						}
					}
				"Condition"
					{
					"instvar" "$no_player_start = 1"
					"Result"
						{
						// Spawns in the elevator.
						"addOverlay" "instances/BEE2/50s/sphere_sp/elevator_entrance/logic.vmf"
						}
					}
				"addShuffleGroup"
					{
					"Var" "$color"
					"Seed" "pipes"
					"Selector"
						{
						"pools" "pipe"
						"value" "0 128 255"
						"Conditions" { "has" "blueGel" }
						}
					"Selector"
						{
						"pools" "pipe"
						"value" "128 255 255"
						"Conditions" { "has" "waterGel" }
						}
					"Selector"
						{
						"pools" "pipe"
						"value" "255 128 0"
						"Conditions" { "has" "orangeGel" }
						}
					"Selector"
						{
						"pools" "pipe"
						"value" "96 96 96"
						"Conditions" { "has" "greyGel" }
						}
					"Selector"
						{
						"pools" "pipe"
						"value" "255 255 255"
						"Conditions" { "has" "whiteGel" }
						}
					"Pool"
						{
						"pipe" "instances/BEE2/50s/sphere_sp/elevator_entrance/pipes_1.vmf"
						"pipe" "instances/BEE2/50s/sphere_sp/elevator_entrance/pipes_2.vmf"
						"pipe" "instances/BEE2/50s/sphere_sp/elevator_entrance/pipes_3.vmf"
						"pipe" "instances/BEE2/50s/sphere_sp/elevator_entrance/pipes_4.vmf"
						"pipe" "instances/BEE2/50s/sphere_sp/elevator_entrance/pipes_5.vmf"
						}
					}
				"Condition"
					{
					"has"	"Neurotoxin"
					"Result"
						{
						"addOverlay" "instances/BEE2/50s/sphere_sp/elevator_entrance/pipes_toxin.vmf"
						}
					}
				}
			}
		}

	"Condition"
		{
		"Priority" "10"
		"Instance" "[spEntryCorr]"
		"Condition"
			{
			"instvar" "$door testchamber"
			"Result"
				{
				"AddOverlay" "instances/BEE2/50s/sphere_sp/entry_door.vmf"
				"TemplateBrush" "BEE2_DOOR_FRAME_50s"
				}
			}
		"Condition"
			{
			"InstVar" "$door remove"
			// Strip the tiles on this side.
			"Switch"
				{
				"Flag" "InstVar" 
				"$attach down"
					{
					"TemplateBrush" "BEE2_CLEAR_VOXEL:neg_z"
					}
				"$attach up"
					{
					"TemplateBrush" "BEE2_CLEAR_VOXEL:pos_z"
					}
				"$attach horizontal"
					{
					"TemplateBrush" "BEE2_CLEAR_VOXEL:neg_x"
					}
				}
			}
		"Result"
			{
			// Place the appropriate corridor template, with signs which alter
			// based on the chamber contents. If not defined, does nothing.
			"TemplateBrush"
				{
				"ID" "$template"
				"Visgroup"
					{
					"gel_bounce"  { "has" "bluegel"    }
					"gel_speed"   { "has" "orangegel"  }
					"gel_dropper" { "has" "geldropper" }
					"spallation"  { "has" "funnel"     }
					"danger"      { "has" "deadly"     }
					"turret"      { "has" "turret"     }
					"airpockets" 
						{
						"OR"
							{
							"has"	"watergel"
							"has"	"goo"
							}
						}
					}
				}
			}
		}

	"Condition"
		{
		"Priority" "50"
		"Instance" "[spEntryCorr], [spExitCorr]"
		"Condition"
			{
			"instvar" "$attach horizontal"
			"StyleVar" "DoorCameras"
			// Basic check that this space is free - check all four blocks, and that it's inside the map.
			"BlockType"
				{
				"Offset" "0 1 1"
				"Type"   "AIR OCCUPIED GOO"
				}
			"PosIsSolid"
				{
				"Pos" "-64 144 80"
				"dir" "1 0 0"
				"Type" "tile"
				}
			"PosIsSolid"
				{
				"Pos" "-64 176 80"
				"dir" "1 0 0"
				"Type" "tile"
				}
			"PosIsSolid"
				{
				"Pos" "-64 144 112"
				"dir" "1 0 0"
				"Type" "tile"
				}
			"PosIsSolid"
				{
				"Pos" "-64 176 112"
				"dir" "1 0 0"
				"Type" "tile"
				}
			"Result"
				{
				"AddOverlay" "instances/BEE2/50s/sphere_sp/door_speaker.vmf"
				}
			}
		}
	
	"Condition"
		{
		"Priority" "10"
		"Instance" "instances/BEE2/60s/sphere_sp/entrance_corridor_4.vmf"
		// Special case for corridor 4, a gel tube is present which needs colors picked.
		"Switch"
			{
			"type" "random"
			"Flag" "has"
			"blueGel"   { "SetInstVar" "$gel_color 0 128 255" }
			"orangeGel" { "SetInstVar" "$gel_color 255 128 0" }
			"whiteGel"  { "SetInstVar" "$gel_color 255 255 255" }
			"greyGel"   { "SetInstVar" "$gel_color 96 96 96" }
			"<default>"
				{
				"Condition"
					{
					"Has" "clearGel" // Never use if any regular is also present.
					"Result"
						{
						"SetInstVar" "$gel_color 128 255 255"
						}
					"Else"  // Default to adhesion.
						{
						"SetInstVar" "$gel_color 0 255 128"
						}
					}
				}
			}
		}
	}
