"Replacements"
	{
	"%TILE_BLACK%" ""
	"%TILE_WHITE%" ""
	"%SOUND_MOVE%" "BEE2.ConveyorBelt.Move"
	"%SOUND_START%" "BEE2.ConveyorBelt.Start"
	"%SOUND_REVERSE%" "BEE2.ConveyorBelt.Reverse"
	"%SOUND_STOP%" "BEE2.ConveyorBelt.Stop"
	}

"Conditions"
	{
	"Condition"
		{
		"instance" "<ITEM_BEE2_CONVEYOR_BELT>"
		"Priority" "-300"
		"Result" 
			{
			"setinstvar" "$sound_move %SOUND_MOVE%"
			"setinstvar" "$sound_start %SOUND_START%"
			"setinstvar" "$sound_reverse %SOUND_REVERSE%"
			"setinstvar" "$sound_stop %SOUND_STOP%"
			"Condition"
				{
				"instvar" "$start_active 1"
				"Result"
					{
					"setinstvar" "$speed 1.5"
					}
				"Else"
					{
					"GetItemConfig" 
						{ 
						"ID"        "BEE2_CONVEYOR" 
						"Name"      "ConveyorSpeed" 
						"Default"   "0.5"
						"ResultVar" "$speed" 
						}
					}
				}
			"Condition"
				{
				"AND"
					{
					"InstVar" "$cube_type 0"
					"has" "whiteGel"
					}
				"Result"
					{
					"setinstvar" "$noportal 1"
					}
				"Else"
					{
					"setinstvar" "$noportal 0"
					}
				}
			"ConveyorBelt"
				{
				"EndInst"			"<ITEM_BEE2_CONVEYOR_BELT:bee2_end>"
				"SegmentInst"       "<ITEM_BEE2_CONVEYOR_BELT:bee2_segment>"
				"TrackInst"			"<ITEM_BEE2_CONVEYOR_BELT:bee2_track>"

				"MotionTrig"        "@is_cube"
				//"EndOutput"         "!activator,RemovePaint,,0.0,-1"
				
				"New"				"1"
				"Speed"				"$speed"
				"NoPortal"			"$noportal"
				"RemovePaint"		"$disable_autorespawn"
				"PaintFizzler"      "1"
				}
			}
		}
	"Condition"
		{
		"instance" "<ITEM_BEE2_CONVEYOR_BELT>"
		"Priority" "-310"
		"Result"
			{
			"SwitchOrientation" "wall"
			"TemplateBrush" "BEE2_CONVEYOR_SOCKET_CLEAN"
			}
		}
	"Condition"
		{
		"instance" "<ITEM_BEE2_CONVEYOR_BELT>"
		"Result"
			{
			"ChangeInstance" "<ITEM_BEE2_CONVEYOR_BELT:bee2_logic>"
			}
		}
	"Condition"
		{
		"instance" "<ITEM_BEE2_CONVEYOR_BELT:bee2_segment>"
		"Condition"
			{
			"InstVar" "$cube_type 0"
			"Result"
				{
				"TemplateBrush"
					{
					"ID" "BEE2_CONVEYOR_SEGMENTS_RETRO:normal"
					"Keys"
						{
						"classname" "func_brush"
						"origin" "0 0 48"
						"solidbsp" "1"
						}
					"localkeys"
						{
						"targetname" "brush"
						}
					}
				}
			}
		"Condition"
			{
			"InstVar" "$cube_type 1"
			"Result"
				{
				"ChangeInstance" ""
				"TemplateBrush"
					{
					"ID" "BEE2_CONVEYOR_SEGMENTS_RETRO:black"
					"Replace"
						{
						"BEE2/clean/black_1x2" "%TILE_BLACK%"
						}
					"Keys"
						{
						"classname" "func_brush"
						"origin" "0 0 48"
						"solidbsp" "1"
						}
					"localkeys"
						{
						"targetname" "brush"
						}
					}
				}
			}
		"Condition"
			{
			"InstVar" "$cube_type 2"
			"Result"
				{
				"ChangeInstance" ""
				"TemplateBrush"
					{
					"ID" "BEE2_CONVEYOR_SEGMENTS_RETRO:white"
					"Replace"
						{
						"tile/white_wall_tile003a" "%TILE_WHITE%"
						}
					"Keys"
						{
						"classname" "func_brush"
						"origin" "0 0 48"
						"solidbsp" "1"
						}
					"localkeys"
						{
						"targetname" "brush"
						}
					}
				}
			}
		"Condition"
			{
			"InstVar" "$cube_type 3"
			"Result"
				{
				"ChangeInstance" "<ITEM_BEE2_CONVEYOR_BELT:bee2_segment_glass>"
				"setinstvar" "$skin 0"
				"TemplateBrush"
					{
					"ID" "BEE2_CONVEYOR_SEGMENTS_RETRO:glass"
					"Keys"
						{
						"classname" "func_brush"
						"origin" "0 0 48"
						"solidbsp" "1"
						}
					"localkeys"
						{
						"targetname" "brush"
						}
					}
				}
			}
		"Condition"
			{
			"instvar" "$cube_type >= 4"
			"Result" // Not yet used, don't allow.
				{
				"Error"
					{
					"ID" "BEE2_CONVEYOR:BAD_CONVEYOR_BELT_CUBE_TYPE"
					"Marker"
						{
						"Type" "Voxel"
						"Offset" "0 0 0"
						}
					}
				}
			}
		}
	"Condition"
		{
		"instance" "<ITEM_BEE2_CONVEYOR_BELT:bee2_track>"
		"Result"
			{
			"TemplateBrush" "BEE2_CONVEYOR_SUPPORT_RUSTY"
			"Condition"
				{
				"NOT"
					{
					// Can't see the supports in goo anyways
					"PosIsGoo" "0 0 0"
					}
				"PosIsSolid"
					{
					"Pos1"  "-48 -48 0"
					"Pos2"  " 48  48 0"
					"Dir"   "0 0 1"
					"Type"  "tile"
					}
				"Result"
					{
					"AddOverlay" "<ITEM_BEE2_CONVEYOR_BELT:bee2_support>"
					"TemplateBrush" "BEE2_CONVEYOR_SUPPORT_RUSTY:pillar"
					}
				}
			}
		}
	}

// Depricated Conveyor Belt item
"Replacements"
	{
	"%BORDER_SIDE%" "[special.behind]"
	}

"Conditions"
	{
	"Condition"  
		{
		"instance"	"<ITEM_BEE2_CONVEYOR:track_platform>"
		"Condition"
			{
			"instvar" "$start_reversed 1"
			"Result"
				{
				"setinstvar" "$speed 350"
				}
			"Else"
				{
				"setinstvar" "$speed 100"
				}
			}
		"Condition"
			{
			"instvar" "$start_active 1"
			"Result"
				{
				"setinstvar" "$start_speed $speed"
				}
			"Else"
				{
				"setinstvar" "$start_speed 0"
				}
			}
		"Result"  
			{
			"ConveyorBelt"
				{
				"SegmentInst"       "<ITEM_BEE2_CONVEYOR:bee2_segment>"
				"MotionTrig"        "@is_cube"
				"EndOutput"         "!activator,RemovePaint,,0.0,-1"
				"RailTemplate"      "BEE2_CONVEYOR_RETRO:rail"
				
				"TrackTeleport"     "1"
				"RotateSegments"    "1"
				"PaintFizzler"      "1"
				"NoPortalFloor"     "1" // The floor is portalable, block that..
				}
			}
		}
		
	"Condition"
		{
		"instance" "<ITEM_BEE2_CONVEYOR:bee2_segment>"
		"Condition"
			{
			"instvar" "$speed = 350"
			"Result"
				{
				// Sounds more fast-paced..
				"setinstvar" "$sound World.a3CrazyBoxLiftTravel"
				}
			"Else"
				{
				"setinstvar" "$sound World.a3JumpIntroPlatformTravel"
				}
			}
		"Result"
			{
			// Running out of fixup vars!
			"RemoveInstVar" "$start_active"
			"RemoveInstVar" "$start_reversed"
			"RemoveInstVar" "$starting_position"
			"RemoveInstVar" "$travel_distance"
			}
		}
		
	// The middle section is also used at the beginning and end, since they're the same..
	"Condition"
		{
		"instance" "<ITEM_BEE2_CONVEYOR:track_bottom, track_top>"
		"Result"
			{
			"AddOverlay"
				{
				"File" "<ITEM_BEE2_CONVEYOR:track_middle>"
				}
			}
		// If not covered by ceiling, add a block on top to hide the spawning platform.
		"Condition"
			{
			"PosIsSolid"
				{
				"Pos"   "-48 -48 128"
				"Pos"   "48 48 128"
				"Dir"   "0 0 -1"
				"Type"  "None"
				"Mode"  "Any"
				}
			"Result"
				{
				"TemplateBrush"
					{
					"ID" "BEE2_CONVEYOR_RETRO:cover"
					}
				}
			}
		}
	"Condition"
		{
		"instance" "<ITEM_BEE2_CONVEYOR:track_middle>"
		"Priority" "150" // After other items do their thing.
		// If it's enclosed on 3 sides + bottom, fill in the support space with tiles.
		"Condition"
			{
			"OR"
				{
				"PosIsSolid"
					{
					"Pos1"  "-48 64 112"
					"Pos2"  " 48 64 16"
					"Dir"   "0 -1 0"
					"Type"  "tile"
					}
				"BlockType"
					{
					"Offset" "0 1 1"
					"Type" "SOLID EMBED"
					}
				}	
			"Result" { "SetInstVar" "$tile_btm 1" }
			"Else"   { "SetInstVar" "$tile_btm 0" }
			}
		"Condition"
			{
			"OR"
				{
				"PosIsSolid"
					{
					"Pos1"  "-48 -64 112"
					"Pos2"  " 48 -64 16"
					"Dir"   "0 1 0"
					"Type"  "tile"
					}
				"BlockType"
					{
					"Offset" "0 1 1"
					"Type" "SOLID EMBED"
					}
				}
			"Result" { "SetInstVar" "$tile_top 1" }
			"Else"   { "SetInstVar" "$tile_top 0" }
			}
		"Condition"
			{
			"InstVar" "$tile_top = 1"
			"InstVar" "$tile_btm = 1"
			"PosIsSolid"
				{
				"Pos1"  "-48 -48 128"
				"Pos2"  " 48  48 128"
				"Dir"   "0 0 -1"
				"Type"  "tile"
				}
			"Result"
				{
				"TemplateBrush"
					{
					"ID" "BEE2_CONVEYOR_TUNNEL_TILE_CLEAN"
					}
				}
			"Else"
				{
				// Otherwise, if either side is not enclosed, add a support.
				"Condition"
					{
					"InstVar" "$tile_top 0"
					"Result"
						{
						"AddOverlay"
							{
							"File" "<ITEM_BEE2_CONVEYOR:bee2_support>"
							}
						}
					}
				"Condition"
					{
					"InstVar" "$tile_btm 0"
					"Result"
						{
						"AddOverlay"
							{
							"File" "<ITEM_BEE2_CONVEYOR:bee2_support>"
							"Rotation" "0 180 0"
							}
						}
					}
				}
			}
		}
		
	"Condition"  
		{ 
		// Put the 'behind' texture on walls bordering the track.
		 "instance"	"<ITEM_BEE2_CONVEYOR:track_rail>" 
		"Priority" "150" // Run after other items init, so we edit static panels.
		// But not in goo.. 
		"!PosIsGoo" "0 0 0"
		"Result"  
			{
			"AlterTexture"
				{
				"Pos" "-64 0 64"
				"Dir" "1 0 0"
				"Tex" "%BORDER_SIDE%"
				}
			"AlterTexture"
				{
				"Pos" "64 0 64"
				"Dir" "-1 0 0"
				"Tex" "%BORDER_SIDE%"
				}
			"AlterTexture"
				{
				"Pos" "0 -64 64"
				"Dir" "0 1 0"
				"Tex" "%BORDER_SIDE%"
				}
			"AlterTexture"
				{
				"Pos" "0 64 64"
				"Dir" "0 -1 0"
				"Tex" "%BORDER_SIDE%"
				}
			
			"AlterTexture"
				{
				"Pos" "0 0 128"
				"Dir" "0 0 -1"
				"Tex" "%BORDER_SIDE%"
				}
			}
		}
	}

