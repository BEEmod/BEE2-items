"Replacements"
	{
	"%SOUND_MOVE%" "BEE2.ConveyorBelt.Move"
	"%SOUND_START%" "BEE2.ConveyorBelt.Start"
	"%SOUND_REVERSE%" "BEE2.ConveyorBelt.Reverse"
	"%SOUND_STOP%" "BEE2.ConveyorBelt.Stop"
	}

"Conditions"
	{
	"Condition"
		{
		"instance" "<ITEM_BEE2_CONVEYOR_BELT>"
		"Priority" "-300"
		"Result" 
			{
			"setinstvar" "$sound_move %SOUND_MOVE%"
			"setinstvar" "$sound_start %SOUND_START%"
			"setinstvar" "$sound_reverse %SOUND_REVERSE%"
			"setinstvar" "$sound_stop %SOUND_STOP%"
			"Condition"
				{
				"instvar" "$start_active 1"
				"Result"
					{
					"setinstvar" "$speed 3"
					}
				"Else"
					{
					"setinstvar" "$speed 1"
					}
				}
			"ConveyorBelt"
				{
				"EndInst"			"<ITEM_BEE2_CONVEYOR_BELT:bee2_end>"
				"SegmentInst"       "<ITEM_BEE2_CONVEYOR_BELT:bee2_segment>"
				"TrackInst"			"<ITEM_BEE2_CONVEYOR_BELT:bee2_track>"

				"MotionTrig"        "@is_cube"
				//"EndOutput"         "!activator,RemovePaint,,0.0,-1"
				
				"New"				"1"
				"RotateSegments"    "1"
				"PaintFizzler"      "1"
				}
			}
		}
	"Condition"
		{
		"instance" "<ITEM_BEE2_CONVEYOR_BELT>"
		"Priority" "-310"
		"Result"
			{
			"SwitchOrientation" "wall"
			"TemplateBrush" "BEE2_CONVEYOR_SOCKET_CLEAN"
			}
		}
	"Condition"
		{
		"instance" "<ITEM_BEE2_CONVEYOR_BELT>"
		"Result"
			{
			"ChangeInstance" "<ITEM_BEE2_CONVEYOR_BELT:bee2_logic>"
			}
		}
	"Condition"
		{
		"instance" "<ITEM_BEE2_CONVEYOR_BELT:bee2_segment>"
		"Condition"
			{
			"InstVar" "$cube_type 0"
			"Result"
				{
				"TemplateBrush"
					{
					"ID" "BEE2_CONVEYOR_SEGMENT_CLEAN"
					"Keys"
						{
						"classname" "func_brush"
						"origin" "0 0 48"
						"solidbsp" "1"
						}
					"localkeys"
						{
						"targetname" "brush"
						}
					}
				}
			}
		"Condition"
			{
			"InstVar" "$cube_type 1"
			"Result"
				{
				"ChangeInstance" ""
				"TemplateBrush"
					{
					"ID" "BEE2_CONVEYOR_SEGMENT_BLACK_CLEAN"
					"Keys"
						{
						"classname" "func_brush"
						"origin" "0 0 48"
						"solidbsp" "1"
						}
					"localkeys"
						{
						"targetname" "brush"
						}
					}
				}
			}
		"Condition"
			{
			"InstVar" "$cube_type 2"
			"Result"
				{
				"ChangeInstance" ""
				"TemplateBrush"
					{
					"ID" "BEE2_CONVEYOR_SEGMENT_WHITE_CLEAN"
					"Keys"
						{
						"classname" "func_brush"
						"origin" "0 0 48"
						"solidbsp" "1"
						}
					"localkeys"
						{
						"targetname" "brush"
						}
					}
				}
			}
		"Condition"
			{
			"InstVar" "$cube_type 3"
			"Result"
				{
				"ChangeInstance" "<ITEM_BEE2_CONVEYOR_BELT:bee2_segment_glass>"
				}
			}
		"Condition"
			{
			"instvar" "$cube_type >= 4"
			"Result" // Not yet used, don't allow.
				{
				"Error"
					{
					"ID" "BEE2_CONVEYOR:BAD_CONVEYOR_BELT_CUBE_TYPE"
					"Marker"
						{
						"Type" "Voxel"
						"Offset" "0 0 0"
						}
					}
				}
			}
		}
	"Condition"
		{
		"instance" "<ITEM_BEE2_CONVEYOR_BELT:bee2_track>"
		"Result"
			{
			"Condition"
				{
				"NOT"
					{
					// Can't see the supports in goo anyways
					"PosIsGoo" "0 0 0"
					}
				"PosIsSolid"
					{
					"Pos1"  "-48 -48 0"
					"Pos2"  " 48  48 0"
					"Dir"   "0 0 1"
					"Type"  "tile"
					}
				"Result"
					{
					"AddOverlay" "<ITEM_BEE2_CONVEYOR_BELT:bee2_support>"
					}
				}
			}
		}
	}

// Depricated Conveyor Belt item
"Replacements"
	{
	"%BORDER_SIDE%" "[special.behind]"
	}

"Conditions"
	{
	"Condition"  
		{
		"instance"	"<ITEM_BEE2_CONVEYOR:track_platform>"
		"Condition"
			{
			"instvar" "$start_reversed 1"
			"Result"
				{
				"setinstvar" "$speed 350"
				}
			"Else"
				{
				"setinstvar" "$speed 100"
				}
			}
		"Condition"
			{
			"instvar" "$start_active 1"
			"Result"
				{
				"setinstvar" "$start_speed $speed"
				}
			"Else"
				{
				"setinstvar" "$start_speed 0"
				}
			}
		"Result"  
			{
			"ConveyorBelt"
				{
				"SegmentInst"       "<ITEM_BEE2_CONVEYOR:bee2_segment>"
				"MotionTrig"        "@is_cube"
				"EndOutput"         "!activator,RemovePaint,,0.0,-1"
				
				"TrackTeleport"     "1"
				"RotateSegments"    "1"
				"PaintFizzler"      "1"
				}
			}
		}
		
	// If not covered by ceiling, add a block on top to hide the spawning platform.
	"Condition"
		{
		"instance" "<ITEM_BEE2_CONVEYOR:track_bottom>"
		"PosIsSolid"
			{
			"Pos"   "-48 -48 128"
			"Pos"   "48 48 128"
			"Dir"   "0 0 -1"
			"Type"  "None"
			"Mode"  "Any"
			}
		"Result"
			{
			// Brushes around the outside
			"TemplateBrush" "BEE2_CONVEYOR_COVER_CLEAN:bottom"
			// Then the top panel.
			"CreatePanel"
				{
				"Pos1" "-48 -48 128"
				"Pos2" " 48  48 128"
				"type" "normal"
				"thickness" "8"
				"bevel" "0"
				"Offset" "0 0 16"
				"Keys"
					{
					"classname" "func_detail"
					}
				}
			}
		}
	"Condition"
		{
		"instance" "<ITEM_BEE2_CONVEYOR:track_top>"
		"PosIsSolid"
			{
			"Pos"   "-48 -48 128"
			"Pos"   "48 48 128"
			"Dir"   "0 0 -1"
			"Type"  "None"
			"Mode"  "Any"
			}
		"Result"
			{
			// Brushes around the outside
			"TemplateBrush" "BEE2_CONVEYOR_COVER_CLEAN:top"
			// Then the top panel.
			"CreatePanel"
				{
				"Pos1" "-48 -48 128"
				"Pos2" " 48  48 128"
				"type" "normal"
				"thickness" "8"
				"bevel" "0"
				"Offset" "0 0 16"
				"Keys"
					{
					"classname" "func_detail"
					}
				}
			}
		}
	// If it's placed in goo on the floor, the supports z-fight with the surface.
	// We don't need the supports anyway then, they're not visible unless you fall in.
	"Condition"
		{
		"instance" "<ITEM_BEE2_CONVEYOR:track_bottom, track_middle, track_top>"
		"NAND"
			{
			"Orientation" "floor"
			"PosIsGoo" "0 0 0"
			}
		// If it's enclosed on 3 sides, fill in the support space with tiles.
		"Condition"
			{
			"PosIsSolid"
				{
				"Pos1"  "-48 -48 128"
				"Pos2"  " 48  48 128"
				"Dir"   "0 0 -1"
				"Type"  "tile"
				}
			"PosIsSolid"
				{
				"Pos1"  "-48 64 112"
				"Pos2"  " 48 64 16"
				"Dir"   "0 -1 0"
				"Type"  "tile"
				}
			"PosIsSolid"
				{
				"Pos1"  "-48 -64 112"
				"Pos2"  " 48 -64 16"
				"Dir"   "0 1 0"
				"Type"  "tile"
				}
			"Result"
				{
				"TemplateBrush" "BEE2_CONVEYOR_TUNNEL_TILE_CLEAN"
				}
			"Else"
				{
				// Add beam supports.
				"AddOverlay" "<ITEM_BEE2_CONVEYOR:bee2_support>"
				}
			}
		}
		
	// The middle section is also used at the beginning and end, since they're the same..
	"Condition"
		{
		"instance" "<ITEM_BEE2_CONVEYOR:track_bottom, track_top>"
		"Result"
			{
			"AddOverlay" "<ITEM_BEE2_CONVEYOR:track_middle>"
			}
		}
	
	"Condition"  
		{ 
		// Put the 'behind' texture on walls bordering the track.
		 "instance"	"<ITEM_BEE2_CONVEYOR:track_rail>" 
		"Priority" "150" // Run after other items init, so we edit static panels.
		// But not in goo.. 
		"!PosIsGoo" "0 0 0"
		"Result"  
			{
			"AlterTexture"
				{
				"Pos" "-64 0 64"
				"Dir" "1 0 0"
				"Tex" "%BORDER_SIDE%"
				}
			"AlterTexture"
				{
				"Pos" "64 0 64"
				"Dir" "-1 0 0"
				"Tex" "%BORDER_SIDE%"
				}
			"AlterTexture"
				{
				"Pos" "0 -64 64"
				"Dir" "0 1 0"
				"Tex" "%BORDER_SIDE%"
				}
			"AlterTexture"
				{
				"Pos" "0 64 64"
				"Dir" "0 -1 0"
				"Tex" "%BORDER_SIDE%"
				}
			
			"AlterTexture"
				{
				"Pos" "0 0 128"
				"Dir" "0 0 -1"
				"Tex" "%BORDER_SIDE%"
				}
			}
		}
	}
